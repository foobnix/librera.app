<div class="app-row__actions">
  {%- for link in include.app.links %}
  {%- if link.home == false and include.page != true %}{% continue %}{% endif %}
  <a class="btn btn--ghost btn--outlined" href="{{ link.href }}">
    {%- if link.icon %}<img class="btn__app-icon" src="{{ link.icon | relative_url }}" alt="" width="20" height="20">{% endif %}
    {%- if link.download %}{% include icon-download.html %}{% endif %}{{ link.label }}</a>
  {%- endfor %}
</div>
