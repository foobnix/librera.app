<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

{% include navbar.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<!-- ?v= is the build time, so a new build is never paired with a cached stylesheet or script. -->
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
