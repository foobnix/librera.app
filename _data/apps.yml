# The Librera apps, in the order the home page shows them.
#
# One entry feeds: the home page row (_includes/app-row.html), the navbar and
# footer links, and the header of the app's own page (_layouts/app.html).
#
#   id         the app page lives at /<id>/ and its images in assets/img/apps/<id>/
#   anchor     the home page row's id (kept stable: old links point at it)
#   nav        short name for the navbar
#   summary    the home page paragraph (HTML allowed)
#   shots      the home page screenshots; class is a .shot modifier
#   links      store / download buttons; the first is the filled one.
#              download: true adds the download glyph.
#   install    optional shell commands shown under the summary ({code, label?});
#              the first also sits beside the buttons on the app's page
#   sections   optional tabs under the app header (multi-page apps)

- id: librerax
  anchor: librerax
  name: LibreraX
  nav: LibreraX
  icon: /assets/img/icons/librerax.png
  category: Reading
  platforms: [Android, iOS, Wear OS, Android Auto]
  summary: >-
    It opens EPUB, MOBI, AZW3, FB2, PDF, CBZ, TXT and Markdown. Keeps a library of the folders you
    point it at, with covers, shelves, tags and search. Reading themes are your own list: added,
    recoloured, reordered and edited over a live page, with the contrast of ink against paper shown
    while you work. Highlights and bookmarks stay with the book; edited titles, authors and covers are
    written into the file itself. It reads aloud through a media session the lock screen and headset
    drive, puts the book you are on into a home-screen widget, and carries the same controls to a
    paired Wear&nbsp;OS watch.
  shots:
    class: shot--pair
    items:
      - src: /assets/img/screenshots/librerax_1.png
        alt: LibreraX library
      - src: /assets/img/screenshots/librerax_2.png
        alt: LibreraX reading a book
  links:
    - label: Google Play
      href: https://play.google.com/store/apps/details?id=com.librerax
    - label: iOS (TestFlight)
      href: https://testflight.apple.com/join/XVU24NY9

- id: librera-reader
  anchor: librera-reader
  name: Librera Reader
  nav: Librera Reader
  icon: /assets/img/icons/librera_reader.png
  category: Reading
  platforms: [Android, Android Auto]
  summary: >-
    Highly customizable and feature-rich application for reading books in PDF, EPUB, MOBI, DjVu, FB2,
    TXT, RTF, AZW, AZW3, HTML, CBZ, CBR formats on Android devices. With its intuitive, yet powerful,
    interface, Librera makes ebook reading a veritable pleasure. It even features a unique
    auto-scrolling, hands-free Musician’s mode. As of today, it can boast more than 10 million
    downloads to devices running all flavors of Android OS.
  shots:
    class: shot--pair
    items:
      - src: /assets/img/screenshots/librera_reader_1.png
        alt: Librera Reader library
      - src: /assets/img/screenshots/librera_reader_2.png
        alt: Librera Reader page navigation
  links:
    - label: Google Play (Pro)
      href: https://play.google.com/store/apps/details?id=com.foobnix.pro.pdf.reader
    - label: Google Play
      href: https://play.google.com/store/apps/details?id=com.foobnix.pdf.reader
    - label: Direct APK
      href: https://github.com/foobnix/LibreraReader
      download: true
    - label: F-Droid
      href: https://f-droid.org/en/packages/com.foobnix.pro.pdf.reader/
    - label: Web
      href: https://librera.mobi
  sections:
    - title: Overview
      url: /librera-reader/
    - title: FAQ
      url: /librera-reader/faq/
    - title: What's new
      url: /librera-reader/what-is-new/
    - title: Download
      url: /librera-reader/download/
    - title: Privacy
      url: /librera-reader/privacy-policy/

