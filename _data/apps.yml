# The Librera apps, in the order the home page shows them.
#
# One entry feeds: the home page row (_includes/app-row.html), the navbar and
# footer links, and the header of the app's own page (_layouts/app.html).
#
#   id         the app page lives at /<id>/ and its images in assets/img/apps/<id>/
#   anchor     the home page row's id (kept stable: old links point at it)
#   nav        short name for the navbar
#   extra_icons  optional further icon tiles shown beside the main icon
#   summary    the home page paragraph (HTML allowed)
#   shots      the home page screenshots; class is a .shot modifier
#   links      store / download buttons, all white outlined pills.
#              download: true adds the download glyph; icon: a small image
#              (e.g. the edition's app icon) before the label; home: false shows the
#              button on the app's own page only, not in the home page row.
#   install    optional shell commands shown under the summary ({code, label?});
#              the first also sits beside the buttons on the app's page
#   sections   optional tabs under the app header (multi-page apps)

- id: librerax
  anchor: librerax
  name: LibreraX
  nav: LibreraX
  icon: /assets/img/icons/librerax.png
  category: Reading
  platforms: [Android, iOS, Wear OS, Android Auto]
  summary: >-
    Reads EPUB, MOBI, AZW3, FB2, PDF, CBZ, TXT and Markdown, and renders every one cleanly — books
    through the WebView, PDFs through PDFium. Highlight and underline in any format, and your marks
    follow you to every device. Rather listen? LibreraX reads aloud, with controls on the lock screen,
    your headset and a Wear&nbsp;OS watch. And your library holds only the folders you choose —
    nothing else on your device is touched.
  shots:
    class: shot--pair
    items:
      - src: /assets/img/screenshots/librerax_1.png
        alt: LibreraX library
      - src: /assets/img/screenshots/librerax_2.png
        alt: LibreraX reading a book
  links:
    - label: Google Play
      href: https://play.google.com/store/apps/details?id=com.librerax
    - label: App Store
      href: https://apps.apple.com/us/app/librerax/id6815773197

- id: librera-reader
  anchor: librera-reader
  name: Librera Reader
  nav: Librera Reader
  icon: /assets/img/icons/librera_reader.png
  extra_icons:
    - /assets/img/icons/icon_pdf_pro.png
  category: Reading
  platforms: [Android, Android Auto]
  summary: >-
    Highly customizable and feature-rich application for reading books in PDF, EPUB, MOBI, DjVu, FB2,
    TXT, RTF, AZW, AZW3, HTML, CBZ, CBR formats on Android devices. With its intuitive, yet powerful,
    interface, Librera makes ebook reading a veritable pleasure. It even features a unique
    auto-scrolling, hands-free Musician’s mode. As of today, it can boast more than 10 million
    downloads to devices running all flavors of Android OS.
  shots:
    class: shot--pair
    items:
      - src: /assets/img/screenshots/librera_reader_1.png
        alt: Librera Reader library
      - src: /assets/img/screenshots/librera_reader_2.png
        alt: Librera Reader page navigation
  links:
    - label: Google Play (Pro)
      href: https://play.google.com/store/apps/details?id=com.foobnix.pro.pdf.reader
      icon: /assets/img/icons/icon_pdf_pro.png
    - label: Google Play
      href: https://play.google.com/store/apps/details?id=com.foobnix.pdf.reader
      icon: /assets/img/icons/librera_reader.png
    - label: Direct APK
      href: https://github.com/foobnix/LibreraReader
      download: true
    - label: F-Droid
      href: https://f-droid.org/en/packages/com.foobnix.pro.pdf.reader/
    - label: Web
      href: https://librera.mobi
  sections:
    - title: Overview
      url: /librera-reader/
    - title: FAQ
      url: /librera-reader/faq/
    - title: What's new
      url: /librera-reader/what-is-new/
    - title: Download
      url: /librera-reader/download/
    - title: Privacy
      url: /librera-reader/privacy-policy/

- id: librera-commander
  anchor: librera-commander
  name: LibreraCommander
  nav: LibreraCommander
  icon: /assets/img/icons/libreracommander.png
  category: Utilities
  platforms: [macOS]
  summary: >-
    A dual-pane file manager for the Mac. Two Finder-style panels with your Finder favourites, a
    built-in terminal with four shells, and an info panel for drives, memory and battery, Quick Look
    and text previews, an editor, file and folder comparison and a media player.
  install:
    - code: brew install foobnix/tap/libreracommander
    - label: Update
      code: brew upgrade libreracommander
  shots:
    class: ""
    items:
      - src: /assets/img/screenshots/libreracommander_2.webp
        alt: LibreraCommander with two project folders side by side, a terminal and the system info panel
  links:
    - label: Direct DMG
      href: https://github.com/foobnix/LibreraCommander-releases/releases/

- id: sound-icon
  anchor: sound-icon
  name: Sound Icon
  nav: Sound Icon
  icon: /assets/img/icons/soundicon.png
  category: Utilities
  platforms: [macOS]
  summary: >-
    Easily switch audio outputs, customize device icons, and star your favorites to switch between
    them in a single click, control volume. Built-in local <b>Music Player</b> and <b>Video Player</b>
  shots:
    class: shot--pair shot--mixed
    items:
      - src: /assets/img/screenshots/SoundIcon.png
        alt: Sound Icon output and volume panel
      - src: /assets/img/screenshots/SoundIconVideo.png
        alt: Sound Icon floating video player
  links:
    - label: Mac App Store
      href: https://apps.apple.com/ua/app/sound-icon/id6777951012?mt=12
    - label: Web
      href: https://soundicon.app/
    - label: Direct DMG
      href: https://github.com/foobnix/librera.app/releases/download/Download/SoundIcon-macOS-1.7.15.dmg
      download: true
      home: false

- id: menu-reminder
  anchor: menu-reminder
  name: Menu Reminder
  nav: Menu Reminder
  icon: /assets/img/icons/menureminder.png
  category: Utilities
  platforms: [iOS, iPadOS, macOS]
  summary: >-
    Your to-dos, one click away in the menu bar. Add a reminder with an optional due date and the list
    groups itself by day — today, tomorrow, overdue in red. When something comes due, the bell lights
    up and a notification arrives; check it off and it's done.
  shots:
    class: shot--pair
    items:
      - src: /assets/img/screenshots/MenuReminder.png
        alt: Menu Reminder on macOS
      - src: /assets/img/screenshots/MenuReminderIphone.png
        alt: Menu Reminder on iPhone
  links:
    - label: Mac App Store
      href: https://apps.apple.com/ua/app/menu-reminder/id6804490236?mt=12
    - label: Direct DMG
      href: https://github.com/foobnix/librera.app/releases/download/Download/MenuReminder-macOS-1.0.1.dmg
      download: true
      home: false
